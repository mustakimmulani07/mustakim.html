                    <span className="px-3 py-1 rounded-full text-xs font-mono bg-slate-950 text-cyan-300 border border-cyan-500/30">

                          <div className="w-full h-2 rounded-full bg-slate-800 overflow-hidden">

                              style={{ width: `${skill.level}%` }}
                              className={`h-full rounded-full bg-gradient-to-r ${cat.accent}`}

                    <li key={i} className="flex items-start gap-2.5">
                      <span className="text-cyan-400">▹</span>

                    </li>

                        required
                        value={hireForm.name}
                        onChange={(e) => setHireForm({ ...hireForm, name: e.target.value })}

                        className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-emerald-500"
                      />
                      <input
                        type="email"
                        required
                        value={hireForm.email}
